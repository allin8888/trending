<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')};
  function fatal(msg){
    $('fatal').style.display='block';$('fatal').textContent=msg;
    var cs=document.querySelectorAll('input,select,button');
    for(var i=0;i<cs.length;i++)cs[i].disabled=true;
  }
  var idx,boot;
  try{boot=JSON.parse($('BOOT').textContent);idx=JSON.parse($('IDX').textContent)}
  catch(e){fatal('索引加载失败（'+(e&&e.message?e.message:'未知错误')+'）：请刷新；若持续出现，说明站点发布缺少索引分片。');return}
  var loaded={};loaded[boot.currentYear]=true;
  var sortState={col:-1,dir:'asc'};
  function topicsOf(){var m={};Object.keys(idx.byTopic||{}).forEach(function(t){(idx.byTopic[t]||[]).forEach(function(r){(m[r]||(m[r]=[])).push(t)})});return m}
  function latestStars(v){for(var i=v.points.length-1;i>=0;i--)if(v.points[i].periodStars!=null)return v.points[i].periodStars;return 0}
  function fill(sel,keys,all){
    sel.innerHTML='';
    var o=document.createElement('option');o.value='';o.textContent=all;sel.appendChild(o);
    keys.forEach(function(k){var x=document.createElement('option');x.value=k;x.textContent=k;sel.appendChild(x)});
  }
  function rebuildSelects(){
    var q=$('q').value,lg=$('lang').value,tp=$('topic').value;
    fill($('lang'),Object.keys(idx.byLang||{}).sort(),'全部语言');
    fill($('topic'),Object.keys(idx.byTopic||{}).sort(),'全部话题');
    $('lang').value=lg;$('topic').value=tp;$('q').value=q;
  }
  function readUrl(){
    var p=new URLSearchParams(location.search);
    $('q').value=p.get('q')||'';$('lang').value=p.get('lang')||'';$('topic').value=p.get('topic')||'';
  }
  function writeUrl(){
    var p=new URLSearchParams();
    if($('q').value.trim())p.set('q',$('q').value.trim());
    if($('lang').value)p.set('lang',$('lang').value);
    if($('topic').value)p.set('topic',$('topic').value);
    var s=p.toString();
    try{history.replaceState(null,'',location.pathname+(s?'?'+s:''))}catch(e){}
  }
  function mergeShard(j){
    var seen={},k,r;
    for(k=0;k<(j.dates||[]).length;k++)seen[j.dates[k]]=1;
    for(k in idx.dates||{})seen[idx.dates[k]]=1;
    for(r in (j.repos||{})){
      var v=j.repos[r];
      if(!idx.repos[r])idx.repos[r]={repo:r,lang:v.lang||null,points:[],search:''};
      if(v.lang)idx.repos[r].lang=v.lang;
      var have={};idx.repos[r].points.forEach(function(p){have[p.date]=1});
      (v.points||[]).forEach(function(p){if(!have[p.date])idx.repos[r].points.push(p)});
      idx.repos[r].points.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
      idx.repos[r].search=[idx.repos[r].search,v.search||''].filter(Boolean).join(' ');
    }
    ['byLang','byTopic','byDate'].forEach(function(name){
      idx[name]=idx[name]||{};
      for(k in (j[name]||{}))(idx[name][k]||(idx[name][k]=[]));
      for(k in (j[name]||{}))(j[name][k]||[]).forEach(function(r2){if(idx[name][k].indexOf(r2)<0)idx[name][k].push(r2)});
    });
    idx.dates=Object.keys(seen).sort();idx.repoCount=Object.keys(idx.repos).length;
  }
  function render(){
    var q=$('q').value.trim(),lg=$('lang').value,tp=$('topic').value,to=topicsOf();
    // 模板字符串内必须双写反斜杠，否则 /s+/ 会退化成 /s+/（按字母 s 分词）
    var words=q.toLowerCase().split(/\s+/).filter(Boolean);
    var rows=Object.keys(idx.repos).filter(function(r){
      var v=idx.repos[r];
      if(words.length){var s=String(v.search||r).toLowerCase();for(var i=0;i<words.length;i++)if(s.indexOf(words[i])<0)return false}
      if(lg&&v.lang!==lg)return false;
      if(tp&&!(to[r]||[]).some(function(t){return t===tp}))return false;
      return true;
    });
    var col=sortState.col,dir=sortState.dir==='asc'?1:-1;
    if(col>=0)rows.sort(function(a,b){
      var x,y,va=idx.repos[a],vb=idx.repos[b];
      if(col===0){x=a;y=b}
      else if(col===1){x=va.lang||'';y=vb.lang||''}
      else if(col===2){x=va.points.length;y=vb.points.length}
      else if(col===3){x=latestStars(va);y=latestStars(vb)}
      else{x=(to[a]||[]).join(',');y=(to[b]||[]).join(',')}
      return (x>y?1:x<y?-1:0)*dir||a.localeCompare(b);
    });
    else rows.sort(function(a,b){return idx.repos[b].points.length-idx.repos[a].points.length||a.localeCompare(b)});
    var applied=(q?1:0)+(lg?1:0)+(tp?1:0);
    $('nDates').textContent=idx.dates.length;$('nRepos').textContent=idx.repoCount;
    $('stat').textContent='匹配 '+rows.length+' / '+idx.repoCount+' 个仓库 · 已应用 '+applied+' 个筛选条件';
    $('tbody').innerHTML=rows.length?rows.map(function(r){
      var v=idx.repos[r],pts=v.points.slice(-8);
      var max=1;pts.forEach(function(p){if(p.periodStars!=null&&p.periodStars>max)max=p.periodStars});
      var bars=pts.map(function(p){
        var h=p.periodStars==null?2:Math.max(2,Math.round(p.periodStars/max*18));
        return '<span class="sb" style="height:'+h+'px" title="'+esc(p.date)+' · '+(p.periodStars==null?'—':p.periodStars)+'"></span>';
      }).join('');
      var axis=pts.map(function(p){return esc(p.date.slice(5))}).join(' ');
      var tags=(to[r]||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
      return '<tr><td><a href="https://github.com/'+esc(r)+'" target="_blank" rel="noopener">'+esc(r)+'</a></td><td>'+esc(v.lang||'—')+'</td><td>'+v.points.length+'</td><td class="spark">'+bars+'<div class="axis">'+axis+'</div></td><td>'+(tags||'—')+'</td></tr>';
    }).join(''):'<tr><td colspan="5">无匹配结果；请调整关键词或点「清除筛选」。</td></tr>';
  }
  function onChange(){writeUrl();render()}
  ['q','lang','topic'].forEach(function(id){$(id).addEventListener(id==='q'?'input':'change',onChange)});
  $('clear').addEventListener('click',function(){$('q').value='';$('lang').value='';$('topic').value='';onChange()});
  $('copy').addEventListener('click',function(){
    writeUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.href).then(function(){$('copyHint').textContent='已复制视图链接'},function(){$('copyHint').textContent='请手动复制地址栏链接'});
    }else $('copyHint').textContent='请手动复制地址栏链接';
  });
  Array.prototype.forEach.call(document.querySelectorAll('.btn-year'),function(btn){
    btn.addEventListener('click',function(){
      var y=btn.getAttribute('data-year');if(loaded[y])return;
      btn.disabled=true;btn.textContent='载入中…';
      fetch('search-index-'+y+'.json').then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json()})
        .then(function(j){mergeShard(j);loaded[y]=true;btn.textContent='已载入 '+y+' 年';rebuildSelects();render()})
        .catch(function(e){btn.disabled=false;btn.textContent='重试 '+y+' 年';$('fatal').style.display='block';$('fatal').textContent='更早年份分片加载失败：'+e.message+'（本地 file:// 预览不支持 fetch，请经站点访问）'});
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(th){
    function doSort(){
      var c=th.cellIndex;
      sortState.dir=(sortState.col===c&&sortState.dir==='asc')?'desc':'asc';sortState.col=c;
      Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(h){h.removeAttribute('aria-sort')});
      th.setAttribute('aria-sort',sortState.dir==='asc'?'ascending':'descending');render();
    }
    th.addEventListener('click',doSort);
    th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();doSort()}});
  });
  rebuildSelects();readUrl();render();
})();
</script></body></html>
