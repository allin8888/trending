      return true;
    });
    var col=sortState.col,dir=sortState.dir==='asc'?1:-1;
    if(col>=0)rows.sort(function(a,b){
      var x,y,va=idx.repos[a],vb=idx.repos[b];
      if(col===0){x=a;y=b}
      else if(col===1){x=va.lang||'';y=vb.lang||''}
      else if(col===2){x=va.points.length;y=vb.points.length}
      else if(col===3){x=latestStars(va);y=latestStars(vb)}
      else{x=(to[a]||[]).join(',');y=(to[b]||[]).join(',')}
      return (x>y?1:x<y?-1:0)*dir||a.localeCompare(b);
    });
    else rows.sort(function(a,b){return idx.repos[b].points.length-idx.repos[a].points.length||a.localeCompare(b)});
    var applied=(q?1:0)+(lg?1:0)+(tp?1:0);
    $('nDates').textContent=idx.dates.length;$('nRepos').textContent=idx.repoCount;
    $('stat').textContent='匹配 '+rows.length+' / '+idx.repoCount+' 个仓库 · 已应用 '+applied+' 个筛选条件';
    $('tbody').innerHTML=rows.length?rows.map(function(r){
      var v=idx.repos[r],pts=v.points.slice(-8);
      var max=1;pts.forEach(function(p){if(p.periodStars!=null&&p.periodStars>max)max=p.periodStars});
      var bars=pts.map(function(p){
        var h=p.periodStars==null?2:Math.max(2,Math.round(p.periodStars/max*18));
        return '<span class="sb" style="height:'+h+'px" title="'+esc(p.date)+' · '+(p.periodStars==null?'—':p.periodStars)+'"></span>';
      }).join('');
      var axis=pts.map(function(p){return esc(p.date.slice(5))}).join(' ');
      var tags=(to[r]||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
      return '<tr><td><a href="https://github.com/'+esc(r)+'" target="_blank" rel="noopener">'+esc(r)+'</a></td><td>'+esc(v.lang||'—')+'</td><td>'+v.points.length+'</td><td class="spark">'+bars+'<div class="axis">'+axis+'</div></td><td>'+(tags||'—')+'</td></tr>';
    }).join(''):'<tr><td colspan="5">无匹配结果；请调整关键词或点「清除筛选」。</td></tr>';
  }
  function onChange(){writeUrl();render()}
  ['q','lang','topic'].forEach(function(id){$(id).addEventListener(id==='q'?'input':'change',onChange)});
  $('clear').addEventListener('click',function(){$('q').value='';$('lang').value='';$('topic').value='';onChange()});
  $('copy').addEventListener('click',function(){
    writeUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.href).then(function(){$('copyHint').textContent='已复制视图链接'},function(){$('copyHint').textContent='请手动复制地址栏链接'});
    }else $('copyHint').textContent='请手动复制地址栏链接';
  });
  Array.prototype.forEach.call(document.querySelectorAll('.btn-year'),function(btn){
    btn.addEventListener('click',function(){
      var y=btn.getAttribute('data-year');if(loaded[y])return;
      btn.disabled=true;btn.textContent='载入中…';
      fetch('search-index-'+y+'.json').then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json()})
        .then(function(j){mergeShard(j);loaded[y]=true;btn.textContent='已载入 '+y+' 年';rebuildSelects();render()})
        .catch(function(e){btn.disabled=false;btn.textContent='重试 '+y+' 年';$('fatal').style.display='block';$('fatal').textContent='更早年份分片加载失败：'+e.message+'（本地 file:// 预览不支持 fetch，请经站点访问）'});
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(th){
    function doSort(){
      var c=th.cellIndex;
      sortState.dir=(sortState.col===c&&sortState.dir==='asc')?'desc':'asc';sortState.col=c;
      Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'),function(h){h.removeAttribute('aria-sort')});
      th.setAttribute('aria-sort',sortState.dir==='asc'?'ascending':'descending');render();
    }
    th.addEventListener('click',doSort);
    th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();doSort()}});
  });
  rebuildSelects();readUrl();render();
})();
</script></body></html>
